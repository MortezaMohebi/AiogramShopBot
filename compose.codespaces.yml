# Codespaces live stack. No production volumes and no implicit provider mutation.
name: telegram-bale-codespace
x-backend-env: &backend-env
  RUNTIME_ENVIRONMENT: "PROD"
  CODESPACE_FRESH_SCHEMA: "true"
  MULTIBOT_V2_RUNTIME_ENABLED: "false"
  SHOP_RELAY_POOL_ENABLED: "false"
  SHOP_WORKFLOW_RUNTIME_ENABLED: "${LIVE_WORKFLOW_RUNTIME_ENABLED:-false}"
  SHOP_WORKFLOW_RUNTIME_KILL_SWITCH: "${LIVE_WORKFLOW_RUNTIME_KILL_SWITCH:-false}"
  MULTIBOT_WEBHOOK_BASE_URL: "${LIVE_WEBHOOK_BASE:?Run setup init}"
  SHOP_SECURITY_ENCRYPTION_KEY: "${LIVE_SECURITY_ENCRYPTION_KEY:?Run setup config to initialize security}"
  SHOP_SMTP_HOST: "${LIVE_SMTP_HOST:-}"
  SHOP_SMTP_PORT: "${LIVE_SMTP_PORT:-}"
  SHOP_SMTP_SECURITY: "${LIVE_SMTP_SECURITY:-}"
  SHOP_SMTP_USERNAME: "${LIVE_SMTP_USERNAME:-}"
  SHOP_SMTP_PASSWORD_B64: "${LIVE_SMTP_PASSWORD_B64:-}"
  SHOP_SMTP_SENDER: "${LIVE_SMTP_SENDER:-}"
  # Approved outbound destinations; updates via the dashboard are limited to
  # these allowlists to prevent leaking the Bot token to unknown relays.
  TELEGRAM_PROXY_ALLOWED_ENDPOINTS: "${LIVE_TELEGRAM_PROXY_ALLOWED_ENDPOINTS:-}"
  TELEGRAM_WORKER_ALLOWED_ORIGINS: "${LIVE_TELEGRAM_WORKER_ALLOWED_ORIGINS:-}"
  WEBAPP_HOST: "0.0.0.0"
  WEBAPP_PORT: "5000"
  POSTGRES_USER: "shop_codespace"
  POSTGRES_PASSWORD: "${LIVE_POSTGRES_PASSWORD:?Run setup}"
  POSTGRES_DB: "shop_codespace"
  DB_USER: "shop_codespace"
  DB_PASS: "${LIVE_POSTGRES_PASSWORD:?Run setup}"
  DB_HOST: "postgres"
  DB_PORT: "5432"
  DB_NAME: "shop_codespace"
  DB_SQL_ECHO: "false"
  REDIS_HOST: "redis"
  REDIS_PASSWORD: "${LIVE_REDIS_PASSWORD:?Run setup}"
  NEXT_ADMIN_BRIDGE_ENABLED: "true"
  NEXT_ADMIN_BRIDGE_SECRET: "${LIVE_BRIDGE_SECRET:?Run setup}"
  SHOP_MEDIA_ROOT: "/bot/media_data"
  SHOP_DIGITAL_ROOT: "/bot/private_data"
  SHOP_MEDIA_MAX_BYTES: "50000000"
  SHOP_ADMIN_SECURE_COOKIES: "true"
  SHOP_DISPLAY_UNIT: "IRR"
  SHOP_CURRENCY_LABEL: "ریال"
  TELEGRAM_FIAT_CHECKOUT_ENABLED: "false"
  TELEGRAM_STARS_CHECKOUT_ENABLED: "false"
  TELEGRAM_STARS_REFUNDS_ENABLED: "false"
  BALE_WALLET_CHECKOUT_ENABLED: "false"
  SHOP_WALLET_MAX_ADMIN_ADJUSTMENT_IRR: "0"
  BALE_BROADCAST_MODE: "standard"
  BALE_BROADCAST_PAID_ENABLED: "false"
  SHOP_CAMPAIGN_DISPATCH_ENABLED: "false"
  SHOP_BROADCAST_WORKER_ENABLED: "false"
  SHOP_BROADCAST_MAX_PAID_CALLS: "0"
x-backend-service: &backend-service
  image: telegram-bale-codespace-backend:local
  build: {context: ., dockerfile: Dockerfile.codespaces}
  environment: *backend-env
  networks: [private]
  init: true
  security_opt: ["no-new-privileges:true"]
  cap_drop: ["ALL"]
services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_USER: "shop_codespace"
      POSTGRES_PASSWORD: "${LIVE_POSTGRES_PASSWORD:?Run setup}"
      POSTGRES_DB: "shop_codespace"
    volumes: ["codespace_pg:/var/lib/postgresql"]
    networks: [private]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 3s
      retries: 30
    restart: unless-stopped
  redis:
    image: redis:7.4-alpine
    environment: {REDIS_PASSWORD: "${LIVE_REDIS_PASSWORD:?Run setup}"}
    command: ["/bin/sh", "-ec", "exec redis-server --appendonly yes --requirepass \"$${REDIS_PASSWORD}\""]
    volumes: ["codespace_redis:/data"]
    networks: [private]
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=\"$${REDIS_PASSWORD}\" redis-cli ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 30
    restart: unless-stopped
  bootstrap:
    <<: *backend-service
    depends_on: {postgres: {condition: service_healthy}}
    # Initializes Store schema; creates no staff identity or bot.
    command: ["python", "-m", "scripts.security_bootstrap"]
    restart: "no"
  app:
    <<: *backend-service
    depends_on:
      bootstrap: {condition: service_completed_successfully}
      redis: {condition: service_healthy}
    command: ["python", "-m", "uvicorn", "scripts.secure_app:app", "--host", "0.0.0.0", "--port", "5000", "--no-access-log"]
    volumes: ["codespace_media:/bot/media_data", "codespace_static:/bot/static", "codespace_private:/bot/private_data"]
    expose: ["5000"]
    healthcheck:
      test: ["CMD", "python", "-c", "from urllib.request import urlopen; assert urlopen('http://127.0.0.1:5000/healthz', timeout=4).status == 200"]
      interval: 10s
      timeout: 6s
      retries: 18
      start_period: 25s
    restart: unless-stopped
  dashboard:
    build:
      context: ./dashboard-next
      dockerfile: Dockerfile.codespaces
      args:
        NEXT_ADMIN_PUBLIC_ORIGIN: "${LIVE_DASHBOARD_ORIGIN:?Run setup}"
        NEXT_ADMIN_CDN_URL: "${LIVE_ADMIN_CDN_URL:-}"
    environment:
      NODE_ENV: "production"
      NEXT_TELEMETRY_DISABLED: "1"
      SHOP_FASTAPI_INTERNAL_URL: "http://app:5000"
      NEXT_ADMIN_PUBLIC_ORIGIN: "${LIVE_DASHBOARD_ORIGIN:?Run setup}"
      NEXT_ADMIN_BRIDGE_SECRET: "${LIVE_BRIDGE_SECRET:?Run setup}"
      NEXT_ADMIN_SESSION_SECRET: "${LIVE_SESSION_SECRET:?Run setup}"
      NEXT_ADMIN_CAPTCHA_PROVIDER: "${LIVE_ADMIN_CAPTCHA_PROVIDER:-none}"
      NEXT_ADMIN_CAPTCHA_SITE_KEY: "${LIVE_ADMIN_CAPTCHA_SITE_KEY:-}"
      NEXT_ADMIN_CAPTCHA_SECRET_KEY: "${LIVE_ADMIN_CAPTCHA_SECRET_KEY:-}"
      NEXT_ADMIN_RECAPTCHA_V3_MIN_SCORE: "${LIVE_ADMIN_RECAPTCHA_V3_MIN_SCORE:-0.5}"
    depends_on: {app: {condition: service_healthy}}
    networks: [private]
    ports: ["127.0.0.1:3000:3000"]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/login').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 6s
      retries: 18
      start_period: 20s
    restart: unless-stopped
  webhook-gateway:
    image: nginx:1.29-alpine
    user: "101:101"
    depends_on: {app: {condition: service_healthy}}
    ports: ["127.0.0.1:8080:8080"]
    volumes: ["./deploy/codespaces/nginx.conf:/etc/nginx/nginx.conf:ro"]
    networks: [private]
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:8080/_edge/health"]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped
  # One shared queue drainer; Runtime remains idle until explicitly enabled.
  runtime-worker:
    <<: *backend-service
    depends_on:
      app: {condition: service_healthy}
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
    volumes: ["codespace_media:/bot/media_data"]
    command: ["python", "-m", "shop_workflow_runtime"]
    restart: on-failure
  broadcast-worker:
    <<: *backend-service
    environment:
      <<: *backend-env
      SHOP_PROCESS_ROLE: "broadcast_worker"
    depends_on:
      bootstrap: {condition: service_completed_successfully}
      redis: {condition: service_healthy}
    volumes: ["codespace_media:/bot/media_data"]
    command: ["python", "-m", "workers.shop_broadcast"]
    restart: unless-stopped
  digital-delivery-worker:
    <<: *backend-service
    depends_on:
      app: {condition: service_healthy}
    volumes: ["codespace_private:/bot/private_data"]
    command: ["python", "-m", "workers.shop_digital_delivery"]
    restart: unless-stopped
  customer-notifications-worker:
    <<: *backend-service
    depends_on:
      app: {condition: service_healthy}
    command: ["python", "-m", "workers.shop_customer_notifications"]
    restart: unless-stopped
  pytest:
    <<: *backend-service
    profiles: ["qa"]
    command: ["python", "-m", "pytest", "-q", "tests"]
    depends_on: {postgres: {condition: service_healthy}}
    restart: "no"
volumes:
  codespace_pg:
  codespace_redis:
  codespace_media:
  codespace_static:
  codespace_private:
networks:
  private: {driver: bridge}
