# Single public HTTPS origin: restricted webhook paths, dashboard everywhere else.
# This gateway is reachable only through Windows localhost and Tailscale Funnel.
worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 256; }
http {
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log off;
    server_tokens off;
    client_max_body_size 50000000;
    client_body_buffer_size 64k;
    proxy_connect_timeout 5s;
    proxy_read_timeout 60s;
    proxy_send_timeout 60s;
    server {
        listen 8081;
        server_name _;
        location = /_edge/health {
            add_header Cache-Control "no-store";
            return 200 "ready\n";
        }
        location ~ "^/webhooks/v2/[0-9a-f-]{36}/[A-Za-z0-9_-]{43}$" {
            limit_except POST { deny all; }
            client_max_body_size 256000;
            proxy_pass http://bot:5000;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Telegram-Bot-Api-Secret-Token $http_x_telegram_bot_api_secret_token;
        }
        location / {
            proxy_pass http://next-admin:3000;
            proxy_http_version 1.1;
            proxy_buffering off;
            proxy_read_timeout 300s;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
    }
}
