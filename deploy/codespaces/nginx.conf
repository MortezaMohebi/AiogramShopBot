# Webhook-only ingress: dashboard, internal API and SQLAdmin are not public.
worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 256; }
http {
    # Nginx master and workers both run as the non-root nginx user.
    # Stock Nginx cache directories are not writable as UID 101.
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log off;
    server_tokens off;
    client_max_body_size 300k;
    client_body_buffer_size 64k;
    proxy_connect_timeout 5s;
    proxy_read_timeout 30s;
    proxy_send_timeout 30s;
    server {
        listen 8080;
        listen [::]:8080;
        server_name _;
        location = /_edge/health {
            add_header Cache-Control "no-store";
            return 200 "ready\n";
        }
        location = /hooks/telegram {
            limit_except POST { deny all; }
            proxy_pass http://app:5000;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Telegram-Bot-Api-Secret-Token $http_x_telegram_bot_api_secret_token;
        }
        location ^~ /webhooks/bale/ {
            limit_except POST { deny all; }
            proxy_pass http://app:5000;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto https;
        }
        location / { return 404; }
    }
}
