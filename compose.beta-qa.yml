# Separate Codespace QA stack. No live credentials, receivers or database reset.
name: aiogram-beta-qa

x-backend: &backend
  image: telegram-bale-codespace-backend:local
  env_file: .codespaces/beta-qa.env
  volumes:
    - .:/bot:ro
    - beta_assets:/qa
  networks: [private]
  working_dir: /bot
  init: true

services:
  postgres:
    image: postgres:18
    env_file: .codespaces/beta-qa.env
    volumes: [beta_pg:/var/lib/postgresql]
    networks: [private]
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U shop_codespace -d shop_codespace']
      interval: 2s
      timeout: 3s
      retries: 30

  redis:
    image: redis:7.4-alpine
    env_file: .codespaces/beta-qa.env
    command: [/bin/sh, -ec, 'exec redis-server --save "" --appendonly no --requirepass "$${REDIS_PASSWORD}"']
    networks: [private]
    healthcheck:
      test: [CMD-SHELL, 'REDISCLI_AUTH="$${REDIS_PASSWORD}" redis-cli ping | grep -q PONG']
      interval: 2s
      timeout: 3s
      retries: 30

  bootstrap:
    <<: *backend
    command: [python, -m, scripts.codespace_bootstrap]
    depends_on:
      postgres: {condition: service_healthy}
    restart: "no"

  api:
    <<: *backend
    command: [python, -m, uvicorn, scripts.test_lab_app:app, --host, 0.0.0.0, --port, '5000']
    ports: ['127.0.0.1:8091:5000']
    depends_on:
      bootstrap: {condition: service_completed_successfully}
      redis: {condition: service_healthy}
    restart: "no"

networks:
  private:
    internal: true
volumes:
  beta_pg:
  beta_assets:
