# Registry-only deployment. Initialize an empty DB or review an existing migration.
services:
  caddy:
    profiles: [edge]
    image: caddy:2.10.2-alpine
    environment:
      WEBHOOK_DOMAIN: "${WEBHOOK_DOMAIN:-}"
    ports: ["80:80", "443:443"]
    networks: [private]
    volumes:
      - ./Caddyfile.template:/etc/caddy/Caddyfile:ro
      - ./caddy_data:/data
      - ./caddy_config:/config
    depends_on: {bot: {condition: service_healthy}}
    restart: unless-stopped

  bot:
    build: {context: .}
    env_file: [.env]
    environment:
      NEXT_ADMIN_BRIDGE_ENABLED: "true"
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
    networks: [private]
    volumes: ["./media_data:/bot/media_data"]
    command: ["python", "-m", "uvicorn", "scripts.secure_app:app", "--host", "0.0.0.0", "--port", "5000", "--no-access-log"]
    healthcheck:
      test: ["CMD", "python", "-c", "from urllib.request import urlopen; assert urlopen('http://127.0.0.1:5000/healthz', timeout=4).status == 200"]
      interval: 10s
      timeout: 6s
      retries: 18
    restart: unless-stopped

  # One shared Runtime queue drainer; per-Store/Bot gates stay explicit.
  runtime-worker:
    build: {context: .}
    env_file: [.env]
    depends_on:
      bot: {condition: service_healthy}
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
    networks: [private]
    volumes: ["./media_data:/bot/media_data"]
    command: ["python", "-m", "shop_workflow_runtime"]
    restart: on-failure

  # One shared worker; provider dispatch is separately disabled by default.
  broadcast-worker:
    profiles: [broadcast]
    build: {context: .}
    env_file: [.env]
    environment: {SHOP_PROCESS_ROLE: broadcast_worker}
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
    networks: [private]
    volumes: ["./media_data:/bot/media_data"]
    command: ["python", "-m", "workers.shop_broadcast"]
    restart: unless-stopped

  next-admin:
    build:
      context: ./dashboard-next
      dockerfile: Dockerfile
      args:
        NEXT_ADMIN_CDN_URL: "${NEXT_ADMIN_CDN_URL:-}"
    env_file: [.env.next-admin]
    environment:
      SHOP_FASTAPI_INTERNAL_URL: http://bot:5000
      NODE_ENV: production
      PORT: "3000"
    depends_on: {bot: {condition: service_healthy}}
    networks: [private]
    # Serve through an owner-managed private HTTPS origin; never expose publicly.
    ports: ["127.0.0.1:3000:3000"]
    restart: unless-stopped

  redis:
    image: redis:7.4-alpine
    command: ["/bin/sh", "-ec", "exec redis-server --appendonly yes --requirepass \"$${REDIS_PASSWORD:?REDIS_PASSWORD is required}\""]
    env_file: [.env]
    volumes: ["redis_data:/data"]
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=\"$${REDIS_PASSWORD}\" redis-cli ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 30
    networks: [private]
    restart: unless-stopped

  postgres:
    image: postgres:18
    env_file: [.env]
    # Preserve the existing installation path, including owner/MFA/order data.
    volumes: ["./postgres_data:/var/lib/postgresql"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 3s
      retries: 30
    networks: [private]
    restart: unless-stopped

volumes:
  redis_data:
networks:
  private: {driver: bridge}
